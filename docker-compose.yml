services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus_ciel
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_ciel"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEXUS_DATABASE_URL: postgresql://nexus:nexus@db:5432/nexus_ciel
      NEXUS_LLM_BASE_URL: ${NEXUS_LLM_BASE_URL:-}
      NEXUS_LLM_MODEL: ${NEXUS_LLM_MODEL:-}
      NEXUS_LLM_API_KEY: ${NEXUS_LLM_API_KEY:-}
      NEXUS_LLM_STAGE: ${NEXUS_LLM_STAGE:-large_model}
      NEXUS_LLM_TIMEOUT_S: ${NEXUS_LLM_TIMEOUT_S:-60}
      NEXUS_LLM_MAX_TOKENS: ${NEXUS_LLM_MAX_TOKENS:-2048}
      NEXUS_LLM_ROUTING_CONFIDENCE: ${NEXUS_LLM_ROUTING_CONFIDENCE:-0.80}
      NEXUS_LLM_COST_PER_1K_TOKENS: ${NEXUS_LLM_COST_PER_1K_TOKENS:-}
      NEXUS_LLM_INPUT_COST_PER_1K_TOKENS: ${NEXUS_LLM_INPUT_COST_PER_1K_TOKENS:-}
      NEXUS_LLM_OUTPUT_COST_PER_1K_TOKENS: ${NEXUS_LLM_OUTPUT_COST_PER_1K_TOKENS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn nexus.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
volumes:
  postgres_data:
