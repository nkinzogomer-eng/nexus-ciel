services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus_ciel
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_ciel"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@postgres:5432/nexus_ciel
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn nexus.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
