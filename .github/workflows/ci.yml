name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancelling in-flight runs is fine on a pull request branch, where only the
# latest push matters. On main it destroys the evidence: run #6 was killed 11
# seconds in by the next commit, and its phase was then treated as unproven.
# Every commit landing on main must get to a conclusion of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - name: Acceptance tests
        run: pytest -q
      - name: End-to-end smoke run
        run: python -m nexus.demo "ci smoke mission"
      - name: Unroutable path still fails cleanly
        run: |
          python -m nexus.demo "ci unroutable mission" \
            --local-confidence 0.1 --secondary-confidence 0.2 && exit 1 || exit 0
