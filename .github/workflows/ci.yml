name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus_ciel
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_ciel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus_ciel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test,postgres]'
      - name: Acceptance tests
        run: pytest -q
      - name: PostgreSQL kill restart gate
        run: pytest -q tests/test_phase2_postgres_kill_restart.py
      - name: End-to-end smoke run
        run: python -m nexus.demo "ci smoke mission"
      - name: Unroutable path still fails cleanly
        run: |
          if python -m nexus.demo "ci unroutable mission" --local-confidence 0.1 --secondary-confidence 0.2; then
            echo "unroutable mission unexpectedly passed"
            exit 1
          fi
